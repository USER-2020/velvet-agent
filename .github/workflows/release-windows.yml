name: Release Windows
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: dtolnay/rust-toolchain@stable
      - run: dotnet test --configuration Release
      - run: dotnet publish src/VelvetAgent.Service -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:IncludeAllContentForSelfExtract=true -o artifacts/service
      - run: npm ci
        working-directory: apps/desktop
      - run: npm run tauri build -- --no-bundle
        working-directory: apps/desktop
      - name: Build joint MSI
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          wix extension add WixToolset.Util.wixext/6.0.2 -g
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne "v$version") { throw 'Tag y versión no coinciden' }
          wix build installer/windows/Package.wxs -arch x64 -ext WixToolset.Util.wixext -d ProductVersion=$version -d ServiceDir=artifacts/service -d DesktopExe=apps/desktop/src-tauri/target/release/velvet-agent-desktop.exe -o artifacts/VelvetAgent.msi
          if (!(Test-Path artifacts/VelvetAgent.msi)) { throw 'Falta MSI' }
          Get-FileHash artifacts/VelvetAgent.msi -Algorithm SHA256 | ForEach-Object { "$($_.Hash)  VelvetAgent.msi" } | Out-File artifacts/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: velvet-agent-windows-unsigned
          path: |
            artifacts/VelvetAgent.msi
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" artifacts/VelvetAgent.msi artifacts/SHA256SUMS.txt --title "VELVET Agent ${{ github.ref_name }}" --notes "MVP Windows sin firma. Consultar docs/DEPLOYMENT.md antes de instalar en producción."
